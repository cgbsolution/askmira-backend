[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# The URL is read from DATABASE_URL_SYNC in env.py, not from here — the
# password does not belong in a checked-in file.
sqlalchemy.url =

# Post-write hooks are off: `ruff` is not exposed as a console_scripts
# entrypoint in this venv, and a failing hook aborts an otherwise good
# migration. Run `ruff format alembic/versions` by hand if you want it.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
