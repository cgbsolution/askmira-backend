[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF",
]
ignore = [
    "B008", # FastAPI's Depends() in a default argument is the idiom, not a bug
    "N811", # SQLAlchemy's postgresql.UUID is a type class, not a constant
]

[tool.ruff.lint.per-file-ignores]
# Model files re-export names purely so Alembic and SQLAlchemy can see them.
"app/models/__init__.py" = ["F401"]
"app/db/base.py" = ["F401"]
# TransientFailure / PermanentFailure are named for the *retry decision* they
# carry, which is the whole reason the two types exist. An "Error" suffix would
# make them read as interchangeable, which is exactly the mistake they prevent.
"app/services/notifications/adapters.py" = ["N818"]
# Same reasoning one layer out: BoardTransientFailure and BoardPermanentFailure
# are named for the retry decision they carry, which is the only reason the two
# types exist. An "Error" suffix would make them read as interchangeable.
"app/services/jobboards/base.py" = ["N818"]
# AdapterUnavailable says what is true — there is no adapter — and it is raised
# alongside the two above, so an "Error" suffix on only this one would suggest a
# different kind of thing.
"app/services/jobboards/registry.py" = ["N818"]
# Same again for calendars: the transient/permanent split is the whole reason
# the two types exist, and an "Error" suffix would flatten the distinction the
# retry logic depends on.
"app/services/calendar/base.py" = ["N818"]
"app/services/calendar/registry.py" = ["N818"]

[tool.ruff.format]
quote-style = "double"
