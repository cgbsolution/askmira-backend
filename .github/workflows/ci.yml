# Lint, unit tests and a migration check on every push and pull request.
#
# The integration suite (~1,400 tests against Postgres) runs nightly and on
# demand (Actions → CI → Run workflow), in seven parallel shards: on every push
# it would cost well over an hour of runner time.

name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Integration tests refuse any database whose name lacks "test".
  TEST_DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/askmira_test

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.9.2
      - run: ruff check app tests alembic

  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: askmira_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit tests (everything outside tests/integration)
        run: pytest -q $(find tests -path tests/integration -prune -o -name 'test_*.py' -print | sort)

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: askmira_migrations }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/askmira_migrations
      DATABASE_URL_SYNC: postgresql+psycopg2://ci:ci@localhost:5432/askmira_migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Upgrade an empty database to head
        run: alembic upgrade head
      - name: The models and the migrations agree
        run: alembic check
      - name: The newest migration reverses and re-applies
        run: alembic downgrade -1 && alembic upgrade head

  integration:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: askmira_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Integration tests, shard ${{ matrix.shard }} of 7
        run: |
          files=$(find tests/integration -name 'test_*.py' | sort | awk -v n=${{ matrix.shard }} 'NR % 7 == n')
          pytest -q $files
